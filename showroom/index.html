<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aru Showroom</title>
<meta name="description" content="Шоу-рум Aru: женщины всех возрастов в своих цветах — как было и как стало.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--berry:#6D2E46;--deep:#4A1D30;--rose:#C2456E;--blush:#F7E6EC;--bg:#FBF4F7;--ink:#2B1A22;--muted:#7A6470;--gold:#D9A441;--white:#fff;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--lift:0 18px 40px -22px rgba(74,29,48,.45)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.5}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
img{display:block;max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(251,244,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid #EFDDE5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.logo{font-family:var(--serif);font-style:italic;font-weight:700;font-size:30px;color:var(--berry);text-decoration:none}
.logo small{font-family:var(--sans);font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--rose);border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:6px}
.back{font-weight:800;font-size:14px;color:#fff;background:var(--berry);text-decoration:none;padding:9px 14px;border-radius:22px;white-space:nowrap}
@media (max-width:520px){header .logo small{display:none}.back{padding:8px 11px;font-size:13px}}
.langs{display:flex;background:#fff;border-radius:30px;padding:3px;box-shadow:0 6px 14px -10px rgba(0,0,0,.4)}
.langs button{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:20px;color:var(--muted)}
.langs button.on{background:var(--berry);color:#fff}
.hero{padding:34px 0 10px}
.hero h1{font-family:var(--serif);font-size:clamp(34px,6vw,58px);line-height:1.02;color:var(--berry);font-weight:700}
.hero h1 em{color:var(--rose)}
.hero p{color:var(--muted);max-width:620px;margin-top:10px;font-size:16px}
.who{display:flex;gap:12px;overflow-x:auto;padding:18px 0 6px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:92px}
.who img{width:76px;height:76px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff,0 8px 18px -10px rgba(0,0,0,.5);transition:box-shadow .2s}
.who button.on img{box-shadow:0 0 0 3px var(--rose),0 8px 18px -10px rgba(0,0,0,.5)}
.who b{font-size:13px;line-height:1.2;text-align:center}
.who span{font-size:12px;color:var(--muted)}
.who .soon img{opacity:.35}
.panel{background:#fff;border-radius:26px;box-shadow:var(--lift);padding:18px;margin:14px 0 30px}
.ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ph h2{font-family:var(--serif);font-size:34px;color:var(--berry);line-height:1}
.pill{display:inline-block;background:var(--blush);color:var(--berry);font-weight:800;font-size:13px;border-radius:20px;padding:4px 12px}
.story{color:var(--muted);margin:8px 0 14px;max-width:760px}
.occ{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.occ::-webkit-scrollbar{display:none}
.occ button{flex:none;font-weight:700;font-size:14px;padding:8px 16px;border-radius:22px;background:var(--blush);color:var(--berry)}
.occ button.on{background:var(--berry);color:#fff}
.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;margin-top:14px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.frame{position:relative;border-radius:20px;overflow:hidden;background:#DADAD7}
.frame img{width:100%}
.ba{position:absolute;left:12px;top:12px;display:flex;background:rgba(255,255,255,.93);border-radius:30px;padding:3px;box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
.ba button{font-size:13px;font-weight:800;padding:8px 14px;border-radius:30px;color:var(--muted)}
.ba button.on{background:var(--berry);color:#fff}
.play{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:var(--rose);color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:30px;box-shadow:0 10px 22px -10px rgba(0,0,0,.6)}
.txt h3{font-family:var(--serif);font-size:30px;color:var(--berry);line-height:1.05}
.txt ul{list-style:none;margin:12px 0;display:grid;gap:8px}
.txt li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.txt li:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--rose);margin-top:8px}
.why{background:var(--blush);border-radius:16px;padding:14px;font-size:14.5px}
.why b{display:block;color:var(--berry);font-size:13px;margin-bottom:4px}
.before-note{background:#FCEFD9;color:#6B4A12;border-radius:16px;padding:14px;font-size:14.5px}
.cta{background:linear-gradient(150deg,#7E3654,#4A1D30);color:#fff;border-radius:26px;padding:26px 20px;margin:10px 0 40px;text-align:center}
.cta h2{font-family:var(--serif);font-size:clamp(28px,4.5vw,40px);line-height:1.05}
.cta p{color:#F3D3DF;margin:8px auto 18px;max-width:560px}
.cta a{display:inline-block;background:var(--gold);color:var(--deep);font-weight:800;text-decoration:none;padding:14px 26px;border-radius:16px;margin:4px}
.cta a.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:0 16px 30px}
.modal{position:fixed;inset:0;background:rgba(20,8,14,.8);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.modal .box{width:min(420px,100%);aspect-ratio:9/16;max-height:88vh;background:#000;border-radius:18px;overflow:hidden;position:relative}
.modal iframe{width:100%;height:100%;border:0}
.modal .x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--berry);font-size:22px;font-weight:800;z-index:2}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="back" href="../app/" id="back">← <span id="backT"></span></a><a class="logo" href="../landing/">Aru<small>Showroom</small></a><div class="langs" id="langs"></div></div></header>
<main class="wrap">
  <section class="hero"><h1 id="h1"></h1><p id="lead"></p></section>
  <div class="who" id="who"></div>
  <section class="panel" id="panel"></section>
  <section class="cta"><h2 id="ctaH"></h2><p id="ctaP"></p><a id="ctaBuy" href="https://kvantor.gumroad.com/l/aru" target="_blank" rel="noopener"></a><a id="ctaMore" class="ghost" href="../landing/"></a></section>
</main>
<footer id="foot"></footer>
<div class="modal" id="modal"><div class="box"><button class="x" data-close aria-label="close">×</button><div id="vid" style="width:100%;height:100%"></div></div></div>
<script src="data.js"></script>
<script>
let L = 0; try{ L = +(localStorage.getItem('aru_sr_lang')||0)||0; }catch(e){}
const S = {
  h1:['Женщины <em>всех возрастов</em> — в своих цветах','Барлық жастағы әйелдер — <em>өз түстерінде</em>','Women of <em>every age</em> — in their own colours'],
  lead:['Нажмите на героиню, выберите случай и переключайте «Как было / Как стало». Все образы подобраны под её цветотип.','Кейіпкерді, жағдайды таңдап, «Бұрын / Кейін» ауыстырыңыз. Барлық бейне оның түс типіне сай.','Pick a woman and an occasion, then switch Before / After. Every look is matched to her colour type.'],
  before:['Как было','Бұрын','Before'], after:['Как стало','Кейін','After'], why:['Почему это работает','Неге жарасады','Why it works'],
  was:['Как было','Бұрын','Before'], age:['лет','жас','y.o.'], video:['Смотреть видео','Видеоны көру','Watch video'],
  soon:['скоро','жақында','soon'],
  ctaH:['Хотите так же — в своих цветах?','Өз түстеріңізде осылай болғыңыз келе ме?','Want this — in your own colours?'],
  ctaP:['Aru разберёт ваш цветотип по фото и покажет вас в ваших образах: «как было» и «как стало».','Aru фото бойынша түс типіңізді анықтап, сізді өз бейнелеріңізде көрсетеді.','Aru finds your colour type from a photo and shows you in your own looks: before and after.'],
  ctaBuy:['Подобрать мои цвета — $29 в месяц','Менің түстерімді таңдау — айына $29','Find my colours — $29 a month'], ctaMore:['Подробнее об Aru','Aru туралы толығырақ','More about Aru'],
  backT:['В приложение','Қосымшаға','To the app'],
  foot:['Изображения созданы ИИ. Героини вымышлены.','Суреттерді ЖИ жасаған. Кейіпкерлер ойдан шығарылған.','Images are AI-generated. The women are fictional.']
};
const t = k => S[k][L], tr = a => a[L];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SR = window.SHOWROOM.slice().sort((a,b)=>b.age-a.age);
let cur = SR[0].id, look = SR[0].looks[0].id, ba = 'after';
try{ const h=location.hash.slice(1); if(SR.some(x=>x.id===h)){ cur=h; look=SR.find(x=>x.id===h).looks[0].id; } }catch(e){}

function render(){
  document.documentElement.lang=['ru','kk','en'][L];
  document.getElementById('langs').innerHTML=['RU','KZ','EN'].map((x,i)=>`<button class="${i===L?'on':''}" data-lang="${i}">${x}</button>`).join('');
  document.getElementById('h1').innerHTML=t('h1'); document.getElementById('lead').textContent=t('lead');
  ['ctaH','ctaP','ctaBuy','ctaMore','foot','backT'].forEach(k=>document.getElementById(k).textContent=t(k));
  document.getElementById('who').innerHTML=SR.map(h=>`<button class="${h.id===cur?'on':''}" data-who="${h.id}"><img src="${h.face}" alt=""><b>${esc(tr(h.name))}</b><span>${h.age} ${t('age')}</span></button>`).join('');
  const h=SR.find(x=>x.id===cur), lk=h.looks.find(x=>x.id===look)||h.looks[0];
  const src = ba==='before' ? h.orig : lk.img;
  document.getElementById('panel').innerHTML=`
    <div class="ph"><h2>${esc(tr(h.name))}, ${h.age}</h2><span class="pill">${esc(tr(h.type))}</span></div>
    <p class="story">${esc(tr(h.story))}</p>
    <div class="occ">${h.looks.map(l=>`<button class="${l.id===lk.id?'on':''}" data-look="${l.id}">${esc(tr(l.t))}</button>`).join('')}</div>
    <div class="stage">
      <div class="frame"><img src="${src}" alt="${esc(tr(h.name))} — ${esc(tr(lk.t))}">
        <div class="ba"><button data-ba="before" class="${ba==='before'?'on':''}">${t('before')}</button><button data-ba="after" class="${ba==='after'?'on':''}">${t('after')}</button></div>
        ${lk.video?`<button class="play" data-video="${esc(lk.video)}">▶ ${t('video')}</button>`:''}
      </div>
      <div class="txt">${ba==='before'
        ? `<h3>${t('was')}</h3><p class="before-note" style="margin-top:12px">${esc(tr(h.before))}</p>`
        : `<h3>${esc(tr(lk.t))}</h3><ul>${lk.items.map(i=>`<li>${esc(tr(i))}</li>`).join('')}</ul><div class="why"><b>${t('why')}</b>${esc(tr(lk.why))}</div>`}
      </div>
    </div>`;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-lang],[data-who],[data-look],[data-ba],[data-video],[data-close]'); if(!g) return;
  if(g.dataset.lang){ L=+g.dataset.lang; try{localStorage.setItem('aru_sr_lang',L);}catch(err){} }
  if(g.dataset.who){ cur=g.dataset.who; look=SR.find(x=>x.id===cur).looks[0].id; ba='after'; try{history.replaceState(null,'','#'+cur);}catch(err){} }
  if(g.dataset.look){ look=g.dataset.look; ba='after'; }
  if(g.dataset.ba){ ba=g.dataset.ba; }
  if(g.dataset.video){ document.getElementById('vid').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(g.dataset.video)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; document.getElementById('modal').classList.add('on'); return; }
  if(g.dataset.close!==undefined){ document.getElementById('modal').classList.remove('on'); document.getElementById('vid').innerHTML=''; return; }
  render();
});
render();
</script>
</body>
</html>
