<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aru — личный стилист</title>
<meta name="description" content="Aru — личный стилист в телефоне: цветотип, причёска, одежда и готовые образы в одной панели.">
<meta name="theme-color" content="#6D2E46">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --berry:#6D2E46; --berry-deep:#4A1D30; --rose:#C2456E; --rose-soft:#E7A3BA;
  --blush:#F7E6EC; --blush-2:#FCF5F7; --gold:#D9A441; --gold-soft:#F3DFB2;
  --ink:#2B1A22; --muted:#7A6470; --line:#EED9E1; --white:#FFFFFF;
  --ok:#3E8A68; --warn:#C98A2B; --bad:#B8434F;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --lift:0 14px 34px -18px rgba(109,46,70,.45);
  --lift-sm:0 6px 18px -10px rgba(109,46,70,.35);
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:#F1DCE4;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:8px}
img{display:block;max-width:100%}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- stage ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:0}
.side{display:none}
.phone{position:relative;width:100%;max-width:440px;height:100dvh;background:var(--blush-2);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){
  body{background:radial-gradient(1200px 700px at 15% 10%,#F7E6EC 0%,#EBCFDA 55%,#E2BFCD 100%)}
  .stage{padding:3vh 24px}
  .phone{height:min(900px,94vh);border-radius:44px;box-shadow:0 40px 80px -30px rgba(74,29,48,.55),0 0 0 10px #2B1A22,0 0 0 11px #4A1D30}
}
@media (min-width:1120px){
  .side{display:block;max-width:330px;color:var(--berry-deep)}
  .side .mark{font-family:var(--serif);font-size:92px;line-height:.9;font-weight:600;font-style:italic;color:var(--berry)}
  .side .ver{margin:10px 0 26px;color:var(--muted);font-size:14px}
  .side p{font-size:15px;margin-bottom:14px}
  .side ul{list-style:none;display:grid;gap:12px;margin-top:8px}
  .side li{display:flex;gap:10px;font-size:14.5px;line-height:1.45}
  .side li .ic{flex:none;color:var(--rose);margin-top:2px}
}

/* ---------- chrome ---------- */
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 10px;background:var(--blush-2);position:relative;z-index:5}
.logo{font-family:var(--serif);font-style:italic;font-weight:700;font-size:30px;line-height:1;color:var(--berry);letter-spacing:.5px}
.logo small{font-family:var(--sans);font-style:normal;font-weight:700;font-size:10px;color:var(--white);background:var(--rose);border-radius:20px;padding:2px 7px;margin-left:8px;vertical-align:6px;letter-spacing:0}
.top-right{display:flex;align-items:center;gap:8px}
.langs{display:flex;background:var(--white);border-radius:30px;padding:3px;box-shadow:var(--lift-sm)}
.langs button{font-size:12px;font-weight:700;padding:6px 9px;border-radius:30px;color:var(--muted)}
.langs button.on{background:var(--berry);color:var(--white)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--white);box-shadow:var(--lift-sm);color:var(--berry)}
.back{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--berry)}
.top-title{font-family:var(--serif);font-weight:700;font-size:24px;color:var(--berry);flex:1;text-align:left;margin-left:4px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto;-webkit-overflow-scrolling:touch}
.content.has-tabs{padding-bottom:100px}
.pad{padding:6px 18px 28px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 6px 8px;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#A8919C}
.tab.on{color:var(--berry)}
.tab.fab .fab-c{width:58px;height:58px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;color:var(--white);background:linear-gradient(145deg,var(--rose),var(--berry));box-shadow:0 12px 24px -10px rgba(109,46,70,.8);border:4px solid var(--white)}
.tab.fab.on{color:var(--rose)}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--white);padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:86%;text-align:center;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ic{display:inline-block;vertical-align:middle;flex:none}

/* ---------- type ---------- */
h2.h{font-family:var(--serif);font-size:32px;line-height:1.05;font-weight:700;color:var(--berry)}
h3.h{font-family:var(--serif);font-size:24px;line-height:1.1;font-weight:700;color:var(--berry)}
.sec{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--serif);font-size:22px;font-weight:700;color:var(--berry);margin:24px 2px 10px}
.sec .count{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.lead{font-size:14.5px;color:var(--muted);margin-top:4px}

/* ---------- blocks ---------- */
.card{background:var(--white);border-radius:var(--r-lg);padding:16px;box-shadow:var(--lift-sm)}
.card+.card{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:16px;font-weight:800;font-size:15px;width:100%}
.btn.primary{background:var(--berry);color:var(--white);box-shadow:0 12px 22px -14px rgba(74,29,48,.9)}
.btn.gold{background:var(--gold);color:var(--berry-deep)}
.btn.ghost{background:var(--blush);color:var(--berry)}
.btn.sm{height:40px;font-size:13.5px;border-radius:12px;padding:0 14px;width:auto}
.link{color:var(--rose);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:30px;background:var(--white);border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--berry);border-color:var(--berry);color:var(--white)}
.chip.static{cursor:default}
.chip.yes{background:#EAF4EE;border-color:#CFE5D8;color:#24573F}
.chip.no{background:#FBEAEC;border-color:#F1CDD2;color:#8D2F3A}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px}
.pill.ok{background:#E3F2EA;color:#2B6B4E} .pill.bad{background:#FBE5E8;color:#9C2F3C} .pill.warn{background:#FCEFD9;color:#8A5A12}
.row{display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.list-check{list-style:none;display:grid;gap:10px}
.list-check li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.list-check .ic{margin-top:1px}
.ok-c{color:var(--ok)} .bad-c{color:var(--bad)} .warn-c{color:var(--warn)}

/* ---------- welcome ---------- */
.welcome{min-height:100%;display:flex;flex-direction:column;padding:16px 22px 26px;background:radial-gradient(520px 420px at 80% -10%,#9B4A6B 0%,transparent 70%),linear-gradient(170deg,#6D2E46 0%,#4A1D30 100%);color:var(--white)}
.welcome .langs{align-self:flex-end;background:rgba(255,255,255,.12);box-shadow:none}
.welcome .langs button{color:#F3D3DF}
.welcome .langs button.on{background:var(--gold);color:var(--berry-deep)}
.wm-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 0 20px}
.wm-av{width:170px;height:170px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px rgba(217,164,65,.35),0 0 0 14px rgba(217,164,65,.12)}
.wordmark{font-family:var(--serif);font-style:italic;font-weight:700;font-size:96px;line-height:.95;margin-top:18px;color:var(--white)}
.wordmark+p{font-family:var(--serif);font-size:23px;line-height:1.25;color:#F3D3DF;max-width:300px;margin-top:6px}
.drape-strip{display:flex;gap:6px;margin-top:22px}
.drape-strip i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.key-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:var(--r-lg);padding:16px}
.key-card label{font-size:13px;font-weight:700;color:#F3D3DF}
.key-in{display:flex;align-items:center;gap:10px;background:var(--white);color:var(--ink);border-radius:14px;padding:0 14px;height:52px;margin:8px 0 12px}
.key-in input{flex:1;border:0;outline:0;font-weight:800;letter-spacing:1.5px;font-size:16px;background:transparent;min-width:0}
.welcome .btn.primary{background:var(--gold);color:var(--berry-deep)}
.key-note{font-size:12.5px;color:#E8C3D1;margin-top:10px;text-align:center}
.buy{margin-top:16px;text-align:center;font-size:14px;color:#F3D3DF}
.buy .link{color:var(--gold-soft)}
.fine{display:flex;justify-content:center;gap:6px;align-items:center;font-size:12px;color:#D9AFC0;margin-top:12px;text-align:center}

/* ---------- onboarding ---------- */
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:6px;transition:width .4s}
.drop{display:block;position:relative;border-radius:var(--r-xl);background:var(--white);border:2px dashed var(--rose-soft);padding:16px;text-align:center;cursor:pointer;margin-top:14px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop .ph{height:250px;border-radius:20px;background:var(--blush);display:grid;place-items:center;overflow:hidden}
.drop .ph img{width:100%;height:100%;object-fit:contain}
.drop .cta{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-weight:800;color:var(--berry)}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tip{background:var(--white);border-radius:var(--r-md);padding:12px 8px;text-align:center;font-size:12.5px;font-weight:700;line-height:1.3;box-shadow:var(--lift-sm)}
.tip .ic{color:var(--rose);margin-bottom:6px}
.q{margin-top:18px}
.q h4{font-size:14px;font-weight:800;margin-bottom:9px}
.range-row{display:flex;align-items:center;gap:14px}
.range-row input{flex:1;accent-color:var(--berry)}
.range-row b{font-family:var(--serif);font-size:26px;color:var(--berry);min-width:84px;text-align:right}
.text-in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--white);outline:0}
.text-in:focus{border-color:var(--rose)}
.ob-foot{display:grid;gap:10px;margin-top:22px}
.ob-foot .link{justify-self:center;font-size:14px}

/* ---------- analyzing ---------- */
.scan{display:flex;flex-direction:column;align-items:center;padding:30px 22px}
.scan-face{position:relative;width:220px;height:220px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 8px var(--white),var(--lift)}
.scan-face img,.scan-face svg{width:100%;height:100%;object-fit:cover}
.scan-face::after{content:"";position:absolute;left:0;right:0;height:46px;background:linear-gradient(180deg,transparent,rgba(217,164,65,.55),transparent);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:-50px}100%{top:230px}}
.steps{list-style:none;width:100%;margin-top:30px;display:grid;gap:12px}
.steps li{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:var(--r-md);padding:13px 14px;font-weight:700;color:var(--muted);box-shadow:var(--lift-sm);transition:.3s}
.steps li .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--blush);color:var(--rose)}
.steps li.done{color:var(--ink)} .steps li.done .st{background:var(--ok);color:var(--white)}
.steps li.now .st{background:var(--gold);color:var(--white);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

/* ---------- home ---------- */
.greet{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 14px}
.hero{position:relative;border-radius:var(--r-xl);padding:20px;color:var(--white);background:linear-gradient(150deg,#7E3654 0%,#4A1D30 100%);overflow:hidden;box-shadow:var(--lift)}
.hero .hero-av{position:absolute;right:16px;top:16px;width:92px;height:92px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.hero .hero-av img{width:100%;height:100%;object-fit:cover;display:block}
.hair-ph{position:relative}
.hair-ph img{filter:grayscale(.35) brightness(.92)}
.ph-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;background:linear-gradient(180deg,rgba(109,46,70,.15),rgba(109,46,70,.72));color:#fff}
.ph-over span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--berry);display:grid;place-items:center}
.ph-over b{font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ph-over small{font-size:12.5px;max-width:300px;opacity:.95}
.mlist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:0}
.mlist li{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.mlist li span{color:var(--muted);font-weight:700}
.tryon-frame{position:relative;border-radius:18px;overflow:hidden;background:#D8D8D5}
.tryon-frame img{width:100%;display:block}
.ba{position:absolute;left:10px;top:10px;display:flex;background:rgba(255,255,255,.93);border-radius:30px;padding:3px;box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
.ba button{font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:30px;color:var(--muted)}
.ba button.on{background:var(--berry);color:#fff}
.who{display:flex;gap:8px;margin:0 0 10px}
.who button{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:30px;background:var(--white);box-shadow:var(--lift-sm);font-weight:800;font-size:13.5px;color:var(--berry)}
.who button img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.who button.on{background:var(--berry);color:#fff}
.tlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.tlist li{display:flex;align-items:center;gap:10px;font-size:14px}
.tlist i{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.whybox{margin-top:12px;background:var(--blush,#F7E6EC);border-radius:14px;padding:12px 14px;font-size:13.5px}
.whybox b{display:block;color:var(--berry);font-size:12.5px;margin-bottom:3px}
.hero .k{font-size:13px;color:#EAC3D2;font-weight:700}
.hero .t{font-family:var(--serif);font-style:italic;font-size:42px;line-height:1;font-weight:700;margin:6px 0 8px;max-width:230px}
.hero p{font-size:13.5px;color:#F3D3DF;max-width:250px}
.hero .strip{display:flex;margin-top:16px;border-radius:10px;overflow:hidden;height:22px}
.hero .strip i{flex:1}
.hero .match{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;font-weight:800;background:rgba(217,164,65,.22);color:var(--gold-soft);padding:5px 10px;border-radius:20px}
.ind{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ind .card{display:flex;align-items:center;gap:12px;padding:13px;margin:0}
.ind .card b{display:block;font-size:15px;line-height:1.2}
.ind .card span{font-size:12px;color:var(--muted);font-weight:600}
.ind button.card{text-align:left}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--white);border-radius:var(--r-lg);padding:14px;text-align:left;box-shadow:var(--lift-sm);display:flex;flex-direction:column;gap:10px;min-height:118px;transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ti{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--white)}
.tile b{font-size:15px;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:-6px}
.tipcard{display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft);border-radius:var(--r-lg);padding:16px;margin-top:14px}
.tipcard .ic{color:var(--berry)}
.tipcard p{font-size:14px;font-weight:600;color:var(--berry-deep)}
.tipcard button{margin-top:8px;font-size:12.5px;font-weight:800;color:var(--berry);text-decoration:underline;text-underline-offset:3px}

/* ---------- avatars & swatches ---------- */
.av svg{display:block;width:100%;height:100%}
.drape{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:var(--white);border-radius:0 0 var(--r-xl) var(--r-xl);padding:12px 16px 16px;margin:0 -18px 6px;box-shadow:0 14px 24px -22px rgba(74,29,48,.8)}
.drape .av{width:150px;height:150px;border-radius:50%;overflow:hidden;transition:filter .3s}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding:6px 11px;border-radius:20px;margin-top:8px}
.verdict.ok{background:#E3F2EA;color:#2B6B4E} .verdict.bad{background:#FBE5E8;color:#9C2F3C}
.cname{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--berry);line-height:1.1}
.sw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;color:var(--ink)}
.sw i{width:100%;aspect-ratio:1;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .15s}
.sw.on i{box-shadow:0 0 0 3px var(--white),0 0 0 5.5px var(--berry);transform:scale(.94)}
.sw-grid.not i{position:relative}
.sw-grid.not .sw i::after{content:"";position:absolute;inset:0}
.neutrals{display:flex;gap:8px;margin-top:12px}
.neutrals div{flex:1;text-align:center;font-size:11.5px;font-weight:700}
.neutrals i{display:block;height:56px;border-radius:14px;margin-bottom:6px}
.metal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.metal div{border-radius:var(--r-md);padding:14px;text-align:center;font-weight:800;font-size:14px}
.metal .disc{width:56px;height:56px;border-radius:50%;margin:0 auto 8px}
.seg{display:flex;background:var(--blush);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:12.5px;font-weight:800;color:var(--muted);line-height:1.2}
.seg button.on{background:var(--white);color:var(--berry);box-shadow:var(--lift-sm)}
.hairc{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.hairc button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;width:58px;text-align:center;line-height:1.15}
.hairc button i{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.hairc button.on i{box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--berry)}
.hairc button.avoid i{position:relative}
.hairc button.avoid i::after{content:"";position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid var(--white)}
.cut-card{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.cut-card .av{width:84px;height:84px;border-radius:50%;overflow:hidden}
.cut-card b{font-size:15px;display:block;margin-bottom:3px}
.cut-card p{font-size:13px;color:var(--muted)}
.cut-card.on{box-shadow:0 0 0 2px var(--berry),var(--lift-sm)}

/* ---------- clothes ---------- */
.body-card{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.meas{display:grid;gap:7px;margin-top:10px}
.meas div{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:12px;font-weight:700}
.meas .bar{height:7px;background:var(--blush);border-radius:6px;overflow:hidden}
.meas .bar i{display:block;height:100%;background:var(--rose);border-radius:6px}
.gar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gar{background:var(--white);border-radius:var(--r-md);padding:10px 8px;text-align:center;font-size:12px;font-weight:700;line-height:1.25;box-shadow:var(--lift-sm)}
.gar svg:not(.ic){width:56px;height:56px;margin:0 auto 6px;display:block}
.gar.no{opacity:.92}
.gar.no svg:not(.ic){opacity:.55}
.gar .mk{display:block;margin:0 auto 4px}

/* ---------- looks ---------- */
.occ{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 4px;margin:0 -18px;scrollbar-width:none}
.occ::-webkit-scrollbar{display:none}
.occ .chip{white-space:nowrap}
.flatlay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:linear-gradient(160deg,#F9EEF2,#F3E2E9);border-radius:var(--r-lg);padding:12px}
.flatlay div{background:rgba(255,255,255,.75);border-radius:14px;aspect-ratio:1;display:grid;place-items:center}

.look-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:14px 2px 6px}
.items{list-style:none;display:grid;gap:2px;margin-top:6px}
.items li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.items li:last-child{border-bottom:0}
.items small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.notes div{background:var(--blush);border-radius:var(--r-md);padding:12px;font-size:13px}
.notes b{display:flex;gap:6px;align-items:center;color:var(--berry);font-size:12.5px;margin-bottom:4px}
.shop{list-style:none;margin-top:12px;display:grid;gap:8px}
.shop li{display:flex;align-items:center;gap:10px;background:var(--blush-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.shop li.done{text-decoration:line-through;color:var(--muted)}
.shop .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--rose);display:grid;place-items:center;flex:none}
.shop li.done .box{background:var(--rose);color:var(--white)}

/* ---------- check ---------- */
.cam{display:block;position:relative;border-radius:var(--r-xl);padding:26px 18px;text-align:center;color:var(--white);background:linear-gradient(150deg,#C2456E 0%,#6D2E46 100%);box-shadow:var(--lift);cursor:pointer}
.cam input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.cam .big{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4)}
.cam b{font-size:18px;display:block}
.cam span{font-size:13px;color:#F6D7E2}
.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sample{background:var(--white);border-radius:var(--r-md);padding:10px;font-size:12px;font-weight:700;line-height:1.25;box-shadow:var(--lift-sm);text-align:center}

.res-top{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center}
.res-img{width:110px;height:130px;border-radius:18px;background:var(--blush);overflow:hidden;display:grid;place-items:center}

.res-img svg{width:80%;height:80%}
.score{display:flex;align-items:center;gap:12px}
.vtitle{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1}
.detect{display:flex;align-items:center;gap:10px;margin:14px 0 4px;padding:10px 12px;background:var(--blush-2);border-radius:12px;font-size:13px}
.detect .dot{width:26px;height:26px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--blush);border-top-color:var(--rose);animation:rot 0.8s linear infinite;margin:20px auto}

.hist{list-style:none;display:grid;gap:8px}
.hist li{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:var(--r-md);padding:9px 12px;font-size:13.5px;box-shadow:var(--lift-sm)}
.hist .thumb{width:40px;height:40px;border-radius:10px;background:var(--blush);overflow:hidden;display:grid;place-items:center;flex:none}
.hist .thumb img{width:100%;height:100%;object-fit:cover}
.hist .thumb svg{width:80%;height:80%}
.hist .grow{flex:1;min-width:0}
.hist b{font-family:var(--serif);font-size:20px}

/* ---------- wardrobe ---------- */

.w-stats .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.w-stats .nums b{font-family:var(--serif);font-size:30px;line-height:1;color:var(--berry);display:block}
.w-stats .nums span{font-size:11px;font-weight:700;color:var(--muted)}
.w-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.w-item{position:relative;background:var(--white);border-radius:var(--r-md);padding:8px 8px 10px;box-shadow:var(--lift-sm);font-size:12px;line-height:1.25}

.w-item .pic img{width:100%;height:100%;object-fit:cover}
.w-item .pic svg{width:76%;height:76%}
.w-item b{display:block;font-size:12.5px}

.w-item .cn .dot{width:10px;height:10px}

.w-item .rm{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--muted);box-shadow:var(--lift-sm)}

.add-panel{margin-top:12px}
.add-panel .drop{margin-top:12px;padding:12px}
.gaps{list-style:none;display:grid;gap:8px;margin-top:10px}
.gaps li{display:flex;align-items:center;gap:10px;font-size:14px}

.chat{display:flex;flex-direction:column;gap:10px;padding:8px 16px 16px}

.msg.me{background:var(--berry);color:var(--white);border-bottom-right-radius:6px;align-self:flex-end}
.msg .swr{display:flex;gap:5px;margin-top:8px}
.msg .swr i{width:22px;height:22px;border-radius:7px}
.ai-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--berry);margin-bottom:4px}
.ai-head .mini{width:26px;height:26px;border-radius:50%;overflow:hidden}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--rose-soft);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

.quick{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .chip{white-space:nowrap;background:var(--blush);border-color:var(--blush);color:var(--berry)}

.composer input{flex:1;height:48px;border-radius:24px;border:1.5px solid var(--line);padding:0 18px;background:var(--white);outline:0;min-width:0}
.composer input:focus{border-color:var(--rose)}
.composer button{width:48px;height:48px;border-radius:50%;background:var(--berry);color:var(--white);display:grid;place-items:center;flex:none}
.chat-wrap{display:flex;flex-direction:column;min-height:100%}
.chat-wrap .chat{flex:1}

.prof-head{display:flex;align-items:center;gap:16px;margin:6px 0 16px}
.prof-head .av{width:84px;height:84px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px var(--white),var(--lift-sm)}
.prof-head .av img{width:100%;height:100%;object-fit:cover}
.kv{list-style:none}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv li:last-child{border-bottom:0}
.kv span{color:var(--muted)} .kv b{text-align:right}
.menu{display:grid;gap:10px;margin-top:14px}
.menu button{display:flex;align-items:center;gap:12px;background:var(--white);padding:14px 16px;border-radius:var(--r-md);font-weight:700;box-shadow:var(--lift-sm);text-align:left}
.menu button .ic{color:var(--rose)}
.menu button.danger{color:var(--bad)} .menu button.danger .ic{color:var(--bad)}
.seri{display:flex;align-items:center;gap:14px;background:#22313A;color:#E7EEF2;border-radius:var(--r-lg);padding:16px;margin-top:14px}
.seri .s{font-family:var(--serif);font-style:italic;font-weight:700;font-size:34px;color:#C9D8C2;line-height:1}
.seri p{font-size:13px;color:#B8C7CF}
.photos{display:flex;gap:10px;margin-top:10px}
.photos div{width:72px;height:92px;border-radius:14px;background:var(--blush);overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.photos img{width:100%;height:100%;object-fit:cover}

/* ---------- print passport ---------- */
#passport{display:none}
@media print{
  body{background:#fff}
  .stage{display:none}
  #passport{display:block;padding:24px;font-family:var(--sans);color:var(--ink)}
  #passport h1{font-family:var(--serif);font-style:italic;font-size:54px;color:var(--berry)}
  #passport h2{font-family:var(--serif);font-size:26px;color:var(--berry);margin:18px 0 8px}
  #passport .pg{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  #passport .pg div{font-size:10px;text-align:center}
  #passport .pg i{display:block;height:46px;border-radius:8px;margin-bottom:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #passport p,#passport li{font-size:13px}
}
</style>
</head>

/* ---------- colour maths ---------- */
const hex2rgb = h => { h = h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; };
const rgb2hex = (r,g,b) => '#' + [r,g,b].map(x => Math.round(x).toString(16).padStart(2,'0')).join('').toUpperCase();
function shade(h, p){ const [r,g,b] = hex2rgb(h); const f = x => Math.max(0, Math.min(255, x + (p<0 ? x*p/100 : (255-x)*p/100))); return rgb2hex(f(r),f(g),f(b)); }
function rgb2lab([r,g,b]){
  [r,g,b] = [r,g,b].map(v => { v/=255; return v>0.04045 ? Math.pow((v+0.055)/1.055,2.4) : v/12.92; });
  let x=(r*0.4124+g*0.3576+b*0.1805)/0.95047, y=(r*0.2126+g*0.7152+b*0.0722), z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const f = v => v>0.008856 ? Math.cbrt(v) : 7.787*v + 16/116;
  x=f(x); y=f(y); z=f(z);
  return [116*y-16, 500*(x-y), 200*(y-z)];
}
const dE = (a,b) => { const p=rgb2lab(hex2rgb(a)), q=rgb2lab(hex2rgb(b)); return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]); };
function nearest(hex, keys){ let best=null, bd=1e9; for(const k of keys){ const d=dE(hex,C[k].hex); if(d<bd){bd=d;best=k;} } return {key:best, d:bd}; }
const isLight = h => { const [r,g,b]=hex2rgb(h); return (r*299+g*587+b*114)/1000 > 165; };

/* Dominant colour of a photo, read locally with canvas */
function dominantColor(img){
  const cv=document.createElement('canvas'), N=72; cv.width=N; cv.height=N;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  const s=Math.min(img.naturalWidth,img.naturalHeight)*0.7;
  cx.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,N,N);
  const d=cx.getImageData(0,0,N,N).data, buckets={};
  let total=0;
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2];
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    const bg = (mx>232 && mx-mn<18); // plain light background
    const key=(r>>4)+'-'+(g>>4)+'-'+(b>>4);
    const o=buckets[key]||(buckets[key]={n:0,r:0,g:0,b:0,bg:bg});
    o.n++; o.r+=r; o.g+=g; o.b+=b; total++;
  }
  const arr=Object.values(buckets).sort((a,b)=>b.n-a.n);
  let pick=arr.find(o=>!o.bg && o.n>total*0.03)||arr[0];
  // merge neighbours of the winning bucket for a smoother average
  const [pr,pg,pb]=[pick.r/pick.n,pick.g/pick.n,pick.b/pick.n];
  let R=0,G=0,B=0,n=0;
  for(const o of arr){ const r=o.r/o.n,g=o.g/o.n,b=o.b/o.n; if(Math.hypot(r-pr,g-pg,b-pb)<38){R+=o.r;G+=o.g;B+=o.b;n+=o.n;} }
  return rgb2hex(R/n,G/n,B/n);
}

function runCheck(hex, type, photo){
  state.checking=true; state.check=null; render();
  setTimeout(()=>{
    const all=nearest(hex, MINE.concat(NOT)), m=nearest(hex, MINE);
    let cs, cScore;
    if(C[all.key].g==='mine' && all.d<=20){ cs='ok'; cScore=100-all.d; }
    else if(C[all.key].g==='mine' || m.d < all.d + 4){ cs='close'; cScore=Math.max(52,74-(m.d-20)); }
    else { cs='bad'; cScore=Math.max(10,38-all.d/4); }
    const fit = type!=='oversize';
    let score = Math.round(cScore*0.7 + (fit?100:25)*0.3);
    if(cs==='bad') score = Math.min(score, 42);
    const combo = state.wardrobe.filter(w=>w.mine && w.type!==type).length;
    const r = {id:SEQ++, hex, type, photo, key: cs==='bad'?all.key:m.key, cs, fit, score, combo, alt: cs==='ok'?null:m.key};
    state.check=r; state.checking=false; state.checks.unshift(r); state.checks=state.checks.slice(0,12); save(); render();
  }, 1100);
}

  lang:a=>{ L=+a; save(); render(); },
  login:async()=>{ if(state.busy) return; const v=(document.getElementById('keyIn').value||'').trim();
    if(/^ARU-[A-Z0-9]{4}-[A-Z0-9]{4}$/i.test(v)){ state.demo=true; state.sub=null; enterApp(); return; }
    if(!v){ toast(t('key_ph')); return; }
    state.busy=true; render(); const d=await api('check',{license_key:v}); state.busy=false;
    if(!d.ok){ render(); toast(why(d.reason)); return; }
    state.wKey=v; state.wEmail=d.email||''; state.wm = d.bound?'signin':'create'; render(); if(d.bound) toast(t('r_key_bound')); },
  wmode:a=>{ state.wm=a; render(); },
  cover:()=>{ state.prev=[]; state.wm='key'; state.screen='welcome'; render(); },
  contdemo:()=>{ enterApp(); },
  keyagain:()=>{ state.demo=false; state.wm='key'; render(); },
  create:async()=>{ if(state.busy) return; const email=(document.getElementById('emIn').value||'').trim(), password=document.getElementById('pwIn').value||'';
    state.wEmail=email; state.busy=true; render();
    const d=await api('activate',{license_key:state.wKey,email,password});
    if(!d.ok){ state.busy=false; render(); toast(why(d.reason)); if(d.reason==='email_exists'||d.reason==='key_bound'){ state.wm='signin'; render(); } return; }
    await ACT.signin(email,password,true); },
  signin:async(em,pw,already)=>{ if(state.busy&&!already) return; const email=typeof em==='string'?em:(document.getElementById('emIn').value||'').trim(), password=typeof pw==='string'?pw:(document.getElementById('pwIn').value||'');
    state.wEmail=email; state.busy=true; render();
    const ok=await sbToken('password',{email,password});
    if(!ok){ state.busy=false; render(); toast(t('r_bad_login')); return; }
    const d=await refreshSub(); state.busy=false;
    if(!d.ok||d.status!=='active'){ render(); toast(why(d.ok?'inactive':d.reason)); return; }
    state.demo=false; enterApp(); },
  cont:async()=>{ state.busy=true; render(); const d=await refreshSub(); state.busy=false; if(!d.ok){ if(d.reason==='not_signed_in'){ AUTH=null; saveAuth(); state.wm='signin'; } render(); toast(why(d.reason)); return; } if(d.status!=='active'){ render(); toast(why('inactive')); return; } state.demo=false; enterApp(); },
  testuse:async()=>{ const d=await api('use',{kind:'tryon'},true); if(d.ok){ state.sub=d; render(); toast(t('tryons_left')+': '+d.tryons_left+' / '+d.tryons_limit); } else { if(d.tryons_left!==undefined){ state.sub=d; render(); } toast(why(d.reason)); } },
  buy:()=>{ window.open(BUY_URL,'_blank','noopener'); },
  obnext:()=>{ if(state.step<2){ state.step++; render(); } else runAnalysis(); },
  obskip:()=>{ state.step++; if(state.step>2) runAnalysis(); else render(); },
  demo:()=>{ state.photos={face:'img/aigerim-face.jpg', body:'img/aigerim-orig.jpg'};
    state.quiz={age:'26–35', height:165, life:['office','events','travel'], budget:'$$', like:['classic','minimal'], dislike:['Мини-юбки, крупный яркий принт','Мини юбка, ірі ашық принт','Mini skirts, big loud prints'][L]};
    state.step=2; render(); toast(t('demo_loaded')); },
  obback:()=>{ state.step=Math.max(0,state.step-1); render(); },
  qone:a=>{ const [g,v]=a.split('|'); state.quiz[g]=v; render(); },
  qmulti:a=>{ const [g,v]=a.split('|'); const arr=state.quiz[g]; const i=arr.indexOf(v); i>=0?arr.splice(i,1):arr.push(v); render(); },
  go:a=>{ if(['home','looks','check','wardrobe','chat'].includes(a)) state.prev=[]; go(a); },
  back:()=>{ state.screen=state.prev.pop()||'home'; render(); },
  drape:a=>{ state.drape=a; render(); },
  cut:a=>{ state.cut=a; render(); },
  hcut:a=>{ state.hcut=a; state.hba='after'; render(); },
  hba:a=>{ state.hba=a; render(); },
  msave:()=>toast(t('m_save_toast')),
  msend:()=>toast(t('m_send_toast')),
  hairc:a=>{ state.hairc=a; render(); },
  lip:a=>{ state.lip=a; render(); },
  occ:a=>{ state.occ=a; state.showShop=false; state.ba='after'; render(); },
  who:a=>{ state.client=a; state.ba='after'; if(a==='elena'&&!['work','day','party'].includes(state.occ)) state.occ='work'; render(); },
  ba:a=>{ state.ba=a; render(); },
  openlook:a=>{ state.occ=a; state.client='aigerim'; state.ba='after'; state.prev=[]; go('looks'); },
  tip:()=>{ state.tip=(state.tip+1)%TIPS.length; render(); },
  shop:()=>{ state.showShop=!state.showShop; render(); },
  shopitem:a=>{ state.shopDone[a]=!state.shopDone[a]; render(); },
  savelook:()=>toast(t('saved')),
  ctype:a=>{ state.checkType=a; render(); },
  sample:a=>{ const s=SAMPLES[+a]; state.checkType=s.type; runCheck(s.hex, s.type, null); },
  recheck:()=>{ state.check=null; render(); },
  addfromcheck:()=>{ const r=state.check; if(!r) return; const it=mkItem(r.type==='oversize'?'knit':r.type,null,r.hex,r.photo); state.wardrobe.unshift(it); save(); state.check=null; render(); toast(t('added')); },
  wf:a=>{ state.wf=a; render(); },
  addopen:()=>{ state.addOpen=!state.addOpen; render(); },
  atype:a=>{ state.addType=a; render(); },
  rm:a=>{ state.wardrobe=state.wardrobe.filter(x=>x.id!==+a); save(); render(); toast(t('removed')); },
  quick:a=>ask(tr(QUICK[+a])),
  send:()=>{ const el=document.getElementById('chatIn'); const v=el.value; el.value=''; ask(v); },
  passport:()=>{ renderPassport(); window.print(); },
  redo:()=>{ state.step=0; state.prev=[]; state.screen='onboard'; render(); },
  delphotos:()=>{ state.photos={face:null,body:null}; render(); toast(t('photos_deleted')); },
  logout:()=>{ AUTH=null; saveAuth(); state.sub=null; state.demo=false; state.wm='key'; state.prev=[]; state.screen='welcome'; render(); }
};
document.addEventListener('click', e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=ACT[el.dataset.act]; if(f){ e.preventDefault(); f(el.dataset.arg, el); } });
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='keyIn') ACT.login();
  if(e.target.id==='pwIn') (state.wm==='create'?ACT.create():ACT.signin());
  if(e.target.id==='chatIn') ACT.send();
});
document.addEventListener('input', e=>{
  if(e.target.id==='hRange'){ state.quiz.height=+e.target.value; const b=document.getElementById('hVal'); if(b) b.textContent=state.quiz.height+' '+t('cm'); }
  if(e.target.id==='dislike'){ state.quiz.dislike=e.target.value; }
});
document.addEventListener('change', e=>{
  const inp=e.target; if(!inp.matches('input[type=file]')||!inp.files[0]) return;
  const kind=inp.dataset.file, file=inp.files[0];
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      // downscale for display; the original never leaves the browser
      const cv=document.createElement('canvas'), m=420, k=Math.min(1,m/Math.max(img.width,img.height));
      cv.width=img.width*k; cv.height=img.height*k; cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const small=cv.toDataURL('image/jpeg',0.82);
      if(kind==='face'||kind==='body'){ state.photos[kind]=small; render(); }
      else if(kind==='check'){ runCheck(dominantColor(img), state.checkType, small); }
      else if(kind==='wardrobe'){ const it=mkItem(state.addType,null,dominantColor(img),small); state.wardrobe.unshift(it); state.addOpen=false; save(); render(); toast(t('added')); }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
});

load();
render();
</script>
</body>
</html>
